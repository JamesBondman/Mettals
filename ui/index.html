<!doctype html><html><head><meta charset="utf-8"><title>Metals</title><style>
:root{--bg:#0d0f12;--pn:rgba(21,26,32,.74);--ln:#252d36;--tx:#e8ecf0;--mu:#7a8794;--ac:#62e6ea;--up:#4fd69c;--dn:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body.fx::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.4;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 75% 0,#000,transparent 70%);animation:dr 40s linear infinite}
@keyframes dr{to{background-position:48px 48px}}
button,input,select{font:inherit;color:inherit;background:none;border:1px solid var(--ln);border-radius:6px;padding:6px 10px;outline:none;transition:.18s}
button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}
select option{background:#151a20}
header{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--ln)}
.brand{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
nav{display:flex;gap:4px;flex:1}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mu);padding:6px 14px}
nav button.on{color:var(--tx);border-color:var(--ac);text-shadow:0 0 12px rgba(98,230,234,.5)}
#st{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dn)}#dot.ok{background:var(--up);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(79,214,156,.6)}100%{box-shadow:0 0 0 9px transparent}}
main{flex:1;overflow:auto;padding:24px 28px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.p{background:var(--pn);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:10px;padding:20px}
.rates{display:grid;grid-template-columns:repeat(4,auto);gap:24px;justify-content:space-between}
.lb{color:var(--mu);font-size:13px}.big{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.md{font-size:18px;font-variant-numeric:tabular-nums}.fu{color:var(--up)!important}.fd{color:var(--dn)!important}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bar .sp{flex:1}.bar button.on{border-color:var(--ac);color:var(--ac);box-shadow:0 0 12px rgba(98,230,234,.2)}
.bar label{color:var(--mu);font-size:13px;display:flex;gap:5px;align-items:center;margin-left:10px}
canvas{width:100%;height:340px;display:block}
.st{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}.st b{font-weight:500;font-variant-numeric:tabular-nums}
.hero{font-size:34px;font-weight:300;margin:6px 0 14px;font-variant-numeric:tabular-nums}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}form input,form select{width:100%}form .cp{grid-column:1/3;display:flex;gap:8px;align-items:center;color:var(--mu)}form .cp input{width:auto}#nt:empty{display:none}form input:disabled{opacity:.6}form button{grid-column:1/3;border-color:var(--ac);color:var(--ac)}
.op{display:grid;grid-template-columns:78px 1fr auto 22px;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px;color:var(--mu)}
.op span:nth-child(2){color:var(--tx)}.op i{cursor:pointer;font-style:normal}.op i:hover{color:var(--dn)}
h3{font-weight:500;font-size:15px;margin-bottom:6px}.mu{color:var(--mu)}
.ov{display:grid;grid-template-columns:110px 1fr 130px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.sh{height:3px;background:var(--ln);border-radius:2px}.sh i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 8px var(--ac);transition:width .7s cubic-bezier(.2,.8,.2,1)}
#ov{position:fixed;inset:0;background:rgba(5,7,9,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}#md{background:#12161b;border:1px solid var(--ln);border-radius:10px;padding:22px;min-width:320px;display:grid;gap:12px;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}}
.view{animation:vw .3s ease-out}@keyframes vw{from{opacity:0;transform:translateX(12px)}}
@media(prefers-reduced-motion){*{animation:none!important;transition:none!important}}
</style></head><body class="fx">
<header><div class="brand"></div><nav id="nav"></nav><div id="st"><span id="dot"></span><span id="stx"></span><button id="gear">⚙</button></div></header>
<main id="main"></main><div id="ov"><div id="md"></div></div>
<script>
const METALS=['gold','silver','platinum','palladium'];
let T={},api,M='overview',P='week',custom=null,show={buy:1,sell:1},snap=null,prev={},data=[],cfg={},t0=0,hov=null,useCur=true,pfd=null,ops=[];
const t=k=>T[k]||k,$=s=>document.querySelector(s);
const nf=(v,d=2)=>new Intl.NumberFormat(T['meta.intl']||'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const rub=v=>nf(v)+' '+t('unit.rub'),sg=v=>(v>0?'+':'')+nf(v);
const cls=v=>v>0.005?'fu':v<-0.005?'fd':'';
function tw(id,to,f,ms=450){const e=document.getElementById(id);if(!e)return;const a=+e.dataset.v||0;e.dataset.v=to;const s=performance.now();
 (function k(n){const q=Math.min(1,(n-s)/ms),z=1-(1-q)**3;e.textContent=f(a+(to-a)*z);if(q<1)requestAnimationFrame(k)})(s)}
function flash(id,c){const e=document.getElementById(id);if(!e)return;e.classList.remove('fu','fd');void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),900)}
function range(){const n=Date.now()/1e3,D=86400;if(P==='custom'&&custom)return custom;return[n-{day:D,week:7*D,month:30*D,year:365*D}[P],n]}
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}const close=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};

function nav(){$('#nav').innerHTML=['overview',...METALS].map(m=>`<button class="${m===M?'on':''}" data-m="${m}">${t('tab.'+m)}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{M=b.dataset.m;hov=null;nav();render()})}
async function render(){const m=$('#main');if(M==='overview')return renderOv(m);
 m.innerHTML=`<div class="grid view"><div class="col"><div class="p rates">
 <div><div class="lb">${t('bank.buys')}</div><div class="big" id="rb">–</div></div><div><div class="lb">${t('bank.sells')}</div><div class="big" id="rs">–</div></div>
 <div><div class="lb">${t('spread')}</div><div class="md" id="sp">–</div></div><div><div class="lb">${t('change')}</div><div class="md" id="ch">–</div></div><div class="lb" id="nt" style="grid-column:1/-1"></div></div>
 <div class="p"><div class="bar">${['day','week','month','year'].map(p=>`<button class="${P===p?'on':''}" data-p="${p}">${t('p.'+p)}</button>`).join('')}
 <button class="${P==='custom'?'on':''}" id="more" title="${t('p.custom')}">⋮</button><span class="sp"></span>
 <label><input type="checkbox" id="sb" ${show.buy?'checked':''}>${t('bank.buys')}</label><label><input type="checkbox" id="ss" ${show.sell?'checked':''}>${t('bank.sells')}</label></div>
 <canvas id="cv"></canvas></div></div><div class="p" id="pos"></div></div>`;
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;render()});
 $('#more').onclick=customDlg;$('#sb').onchange=e=>show.buy=e.target.checked?1:0;$('#ss').onchange=e=>show.sell=e.target.checked?1:0;
 const c=$('#cv');c.onmousemove=e=>hov=e.offsetX;c.onmouseleave=()=>hov=null;
 t0=performance.now();await load();}
async function load(){if(M==='overview')return;const[a,b]=range();[data,pfd,ops]=await Promise.all([api.history(M,a,b),api.portfolio(M),api.ops(M)]);paint()}
function paint(){const r=snap&&snap.rates[M];if(r){tw('rb',r.buy,nf);tw('rs',r.sell,nf);tw('sp',r.sell-r.buy,nf);
  if(data.length){const ch=r.buy-data[0][1];const e=$('#ch');if(e){e.className='md '+cls(ch);e.textContent=sg(ch)+' ('+sg(ch/data[0][1]*100)+'%)'}}}
 const nt=$('#nt');if(nt)nt.textContent=snap&&snap.status.src==='cbr'?t('src.note'):'';const p=pfd,e=$('#pos');if(!p||!e)return;const day=new Date().toISOString().slice(0,10);
 const keep=['g','pr','dt','kd'].map(i=>document.getElementById(i)?.value);
 e.innerHTML=`<h3>${t('position')}</h3><div class="lb">${t('sell.now')}</div><div class="hero">${rub(p.value)}</div>
 <div class="st"><span>${t('unrealized')}</span><b class="${cls(p.unreal)}">${sg(p.unreal)} ${t('unit.rub')} (${sg(p.pct)}%)</b></div>
 <div class="st"><span>${t('grams')}</span><b>${nf(p.grams,2)} ${t('unit.g')}</b></div><div class="st"><span>${t('invested')}</span><b>${rub(p.invested)}</b></div>
 <div class="st"><span>${t('avg.price')}</span><b>${rub(p.avg)}</b></div><div class="st"><span>${t('realized')}</span><b class="${cls(p.realized)}">${sg(p.realized)} ${t('unit.rub')}</b></div>
 <div class="st"><span>${t('total.result')}</span><b class="${cls(p.total)}">${sg(p.total)} ${t('unit.rub')}</b></div>
 <form id="f"><select id="kd"><option value="buy">${t('op.buy')}</option><option value="sell">${t('op.sell')}</option></select><input id="dt" type="date" value="${day}">
 <input id="g" type="number" step="any" min="0" placeholder="${t('grams')}"><input id="pr" type="number" step="any" min="0" placeholder="${t('price.gram')}"><label class="cp"><input type="checkbox" id="cp" ${useCur?'checked':''}>${t('at.current')}</label><button>${t('add')}</button></form>
 <h3>${t('operations')}</h3>${ops.length?ops.map(o=>`<div class="op"><span>${new Date(o.ts*1e3).toLocaleDateString(T['meta.intl'])}</span><span>${t('op.'+o.kind)} ${nf(o.grams)} ${t('unit.g')}</span><span>${nf(o.total/o.grams)}</span><i data-d="${o.id}">×</i></div>`).join(''):`<div class="mu">${t('empty.ops')}</div>`}`;
 ['kd','dt','g','pr'].forEach((i,k)=>{if(keep[['g','pr','dt','kd'].indexOf(i)])document.getElementById(i).value=keep[['g','pr','dt','kd'].indexOf(i)]});
 const curP=()=>{const r=snap&&snap.rates[M];if(!r)return 0;let b=r.buy,s=r.sell;const g=+$('#g').value;
  if(r.tiers&&r.tiers.length){const T2=r.tiers.find(x=>g>=x[0]&&g<=x[1])||(g>r.tiers[r.tiers.length-1][1]?r.tiers[r.tiers.length-1]:r.tiers[0]);b=T2[2];s=T2[3]}
  return $('#kd').value==='buy'?s:b};
 const syncP=()=>{const q=$('#pr');q.disabled=useCur;if(useCur)q.value=curP()||''};
 $('#cp').onchange=e=>{useCur=e.target.checked;if(!useCur)$('#pr').value='';syncP()};$('#kd').onchange=syncP;$('#g').oninput=syncP;syncP();
 $('#f').onsubmit=async ev=>{ev.preventDefault();const g=+$('#g').value,pr=useCur?curP():+$('#pr').value;if(!(g>0&&pr>0))return;
  await api.add_op(M,$('#kd').value,g,pr,new Date($('#dt').value+'T12:00').getTime()/1e3);await load()};
 document.querySelectorAll('[data-d]').forEach(i=>i.onclick=async()=>{await api.del_op(+i.dataset.d);await load()})}
function customDlg(){const d=new Date().toISOString().slice(0,10);modal(`<h3>${t('p.custom')}</h3><label class="lb">${t('from')}<br><input id="a" type="date" value="${d}"></label><label class="lb">${t('to')}<br><input id="b" type="date" value="${d}"></label>
 <div class="bar"><button id="ok" class="on">${t('apply')}</button><button id="no">${t('cancel')}</button></div>`);
 $('#no').onclick=close;$('#ok').onclick=()=>{const a=new Date($('#a').value+'T00:00').getTime()/1e3,b=new Date($('#b').value+'T23:59').getTime()/1e3;if(a&&b&&b>a){custom=[a,b];P='custom';close();render()}}}
async function renderOv(m){const o=await api.overview();
 m.innerHTML=`<div class="p view" style="max-width:820px"><div class="lb">${t('total.value')}</div><div class="hero" id="tv">0</div>
 <div class="st"><span>${t('unrealized')}</span><b id="tu"></b></div><div class="st"><span>${t('realized')}</span><b id="tr"></b></div>
 ${METALS.map(k=>`<div class="ov"><span>${t('tab.'+k)}</span><div class="sh"><i data-w="${o.value?o.metals[k].value/o.value*100:0}"></i></div><b style="text-align:right;font-weight:500">${rub(o.metals[k].value)}</b></div>`).join('')}</div>`;
 tw('tv',o.value,rub,700);const u=$('#tu'),r=$('#tr');u.className=cls(o.unreal);u.textContent=sg(o.unreal)+' '+t('unit.rub');r.className=cls(o.realized);r.textContent=sg(o.realized)+' '+t('unit.rub');
 requestAnimationFrame(()=>document.querySelectorAll('.sh i').forEach(i=>i.style.width=i.dataset.w+'%'))}

// ---- chart ----
function loop(n){requestAnimationFrame(loop);const c=$('#cv');if(!c)return;draw(c,n)}
function draw(c,n){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)){c.width=r.width*d;c.height=r.height*d}
 const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);const W=r.width,H=r.height,pr=70,pb=24,pt=10;
 if(data.length<2){x.fillStyle='#7a8794';x.font='13px Segoe UI';x.fillText(t('chart.empty'),10,30);return}
 const ks=[['buy',1,'#62e6ea'],['sell',2,'#9aa6b2']].filter(k=>show[k[0]]);if(!ks.length)return;
 const vals=data.flatMap(p=>ks.map(k=>p[k[1]])),lo=Math.min(...vals),hi=Math.max(...vals),pd=(hi-lo||1)*.12,mn=lo-pd,mx=hi+pd;
 const a=data[0][0],b=data[data.length-1][0],X=ts=>(W-pr)*(ts-a)/((b-a)||1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const pg=matchMedia('(prefers-reduced-motion)').matches?1:Math.min(1,(n-t0)/800),e=1-(1-pg)**3;
 x.font='11px Consolas,monospace';x.strokeStyle='#252d36';x.fillStyle='#7a8794';x.lineWidth=1;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);x.beginPath();x.moveTo(0,y);x.lineTo(W-pr,y);x.stroke();x.fillText(nf(v,v<1000?2:0),W-pr+8,y+4)}
 const fd=ts=>new Date(ts*1e3).toLocaleString(T['meta.intl'],P==='day'?{hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short',year:b-a>2e7?'2-digit':undefined});
 x.fillText(fd(a),0,H-6);const lt=fd(b);x.fillText(lt,W-pr-x.measureText(lt).width,H-6);
 x.save();x.beginPath();x.rect(0,0,(W-pr)*e+1,H);x.clip();
 ks.forEach(([k,i,col],j)=>{x.beginPath();data.forEach((p,q)=>q?x.lineTo(X(p[0]),Y(p[i])):x.moveTo(X(p[0]),Y(p[i])));x.strokeStyle=col;x.lineWidth=j?1.2:1.8;x.shadowColor=col;x.shadowBlur=j?0:10;x.stroke();x.shadowBlur=0;
  if(!j){x.lineTo(X(b),H-pb);x.lineTo(0,H-pb);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(98,230,234,.22)');g.addColorStop(1,'rgba(98,230,234,0)');x.fillStyle=g;x.fill()}});x.restore();
 if(pg>=1){const L=data[data.length-1],px=X(L[0]),py=Y(L[ks[0][1]]),ph=(n/900)%1;x.fillStyle=ks[0][2];x.beginPath();x.arc(px,py,3.5,0,7);x.fill();
  x.strokeStyle='rgba(98,230,234,'+(1-ph)*.6+')';x.beginPath();x.arc(px,py,3.5+ph*12,0,7);x.stroke()}
 if(hov!=null&&hov<W-pr){let q=0,bd=1e9;data.forEach((p,i)=>{const dd=Math.abs(X(p[0])-hov);if(dd<bd){bd=dd;q=i}});const p=data[q],px=X(p[0]);
  x.strokeStyle='#7a8794';x.setLineDash([3,4]);x.beginPath();x.moveTo(px,pt);x.lineTo(px,H-pb);x.stroke();x.setLineDash([]);
  ks.forEach(([k,i,col])=>{x.fillStyle=col;x.beginPath();x.arc(px,Y(p[i]),4,0,7);x.fill()});
  const lines=[fd(p[0]),...ks.map(k=>t(k[0]==='buy'?'bank.buys':'bank.sells')+'  '+nf(p[k[1]]))],bw=Math.max(...lines.map(l=>x.measureText(l).width))+20,bx=px+bw+16>W-pr?px-bw-10:px+10;
  x.fillStyle='rgba(18,22,27,.94)';x.strokeStyle='#252d36';x.beginPath();x.rect(bx,pt+4,bw,lines.length*17+10);x.fill();x.stroke();x.fillStyle='#e8ecf0';lines.forEach((l,i)=>x.fillText(l,bx+10,pt+22+i*17))}}

// ---- live ----
async function tick(){try{const s=await api.snapshot(),r=s.rates[M];
  if(r&&prev[M]&&(r.buy!==prev[M].buy||r.sell!==prev[M].sell)){snap=s;await load();flash('rb',r.buy>prev[M].buy?'fu':'fd');flash('rs',r.sell>prev[M].sell?'fu':'fd')}
  else{snap=s;if(r&&!prev[M])paint()}
  METALS.forEach(m=>prev[m]=s.rates[m]);
  $('#dot').className=s.status.ok?'ok':'';const ts=s.status.ts?new Date(s.status.ts*1e3).toLocaleTimeString(T['meta.intl']):'';
  $('#stx').textContent=(s.status.ok?t('status.live'):t('status.offline'))+(s.status.src?' · '+t('src.'+s.status.src):'')+(ts?' · '+t('updated')+' '+ts:'')}catch(e){}}
$('#gear').onclick=async()=>{const L=await api.locales();modal(`<h3>${t('settings')}</h3><label class="lb">${t('language')}<br><select id="lg">${Object.entries(L).map(([k,v])=>`<option value="${k}" ${k===cfg.lang?'selected':''}>${v}</option>`).join('')}</select></label>
 <label class="lb">${t('refresh')}<br><input id="iv" type="number" min="15" value="${cfg.interval}"></label><label class="lb">${t('rates.url')}<br><input id="ru" style="width:100%" placeholder="https://" value="${cfg.rates_url||''}"></label><label class="lb">${t('history.url')}<br><input id="hu" style="width:100%" placeholder="https://raw.githubusercontent.com/..." value="${cfg.history_url||''}"></label><label class="lb"><input id="fx" type="checkbox" ${cfg.fx?'checked':''}> ${t('animations')}</label>
 <div class="bar"><button id="ex">${t('export')}</button><button id="im">${t('import')}</button><input id="fi" type="file" accept=".json" hidden></div>`);
 $('#lg').onchange=async e=>{cfg.lang=e.target.value;await api.set_config('lang',cfg.lang);T=await api.locale(cfg.lang);close();nav();render();tick()};
 $('#iv').onchange=e=>{cfg.interval=+e.target.value;api.set_config('interval',cfg.interval)};
 $('#ru').onchange=e=>{cfg.rates_url=e.target.value.trim();api.set_rates_url(cfg.rates_url)};
 $('#hu').onchange=e=>{cfg.history_url=e.target.value.trim();api.set_history_url(cfg.history_url)};
 $('#fx').onchange=e=>{cfg.fx=e.target.checked;document.body.classList.toggle('fx',cfg.fx);api.set_config('fx',cfg.fx)};
 $('#ex').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await api.export_ops()],{type:'application/json'}));a.download='metals-operations.json';a.click()};
 $('#im').onclick=()=>$('#fi').click();$('#fi').onchange=async e=>{await api.import_ops(await e.target.files[0].text());close();render()}};
window.addEventListener('pywebviewready',async()=>{api=pywebview.api;cfg=await api.config();T=await api.locale(cfg.lang);document.body.classList.toggle('fx',cfg.fx);nav();await render();tick();setInterval(tick,5000);requestAnimationFrame(loop)});
</script></body></html>
